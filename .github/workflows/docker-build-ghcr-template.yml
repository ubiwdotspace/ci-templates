name: Docker Build and Push to GHCR

on:
  workflow_call:
    inputs:
      image_name:
        description: 'Target image name in GHCR (e.g. auth-service-rest)'
        type: string
        required: true
      build_arg_api:
        description: 'Value for ARG API (e.g. rest or grpc)'
        type: string
        required: false
        default: 'rest'
      platforms:
        description: 'Target platforms for multi-arch build'
        type: string
        required: false
        default: 'linux/arm64'
      dockerfile:
        description: 'Path to Dockerfile'
        type: string
        required: false
        default: 'Dockerfile'

jobs:
  build-and-push:
    name: Build & Push ${{ inputs.image_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ inputs.image_name }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          push: true
          platforms: ${{ inputs.platforms }}
          build-args: |
            API=${{ inputs.build_arg_api }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ inputs.image_name }}-${{ inputs.build_arg_api }}
          cache-to: type=gha,mode=max,scope=${{ inputs.image_name }}-${{ inputs.build_arg_api }}
